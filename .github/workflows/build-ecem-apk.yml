name: Build Ecem Android APK

on:
  push:
    branches:
      - ecem-yemek-app-build
    paths:
      - "ecem-build/**"
      - ".github/workflows/build-ecem-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          mkdir -p ecem-android
          base64 -d ecem-build/project.tar.gz.b64 | tar -xz -C ecem-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ecem-android
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp ecem-android/app/build/outputs/apk/debug/app-debug.apk Ecem-Yemek-Zamani.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ecem-Yemek-Zamani-APK
          path: Ecem-Yemek-Zamani.apk
